plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ichiji.kana'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ichiji.kana'
        minSdk 26
        targetSdk 36
        // Builds on GitHub set VERSION_CODE so every build counts up, as Google Play requires.
        versionCode((System.getenv('VERSION_CODE') ?: '3') as Integer)
        versionName '1.1.2'
    }

    // The upload key for Google Play is NOT in this repo. The release build on GitHub
    // reads it from two repository secrets (see README, "Publishing on Google Play").
    def uploadStore = System.getenv('ICHIJI_UPLOAD_STORE')

    signingConfigs {
        // A throwaway key so test builds install over each other on your phone.
        shared {
            storeFile file('ichiji-debug.keystore')
            storePassword 'android'
            keyAlias 'ichiji'
            keyPassword 'android'
        }
        if (uploadStore) {
            create('upload') {
                storeFile file(uploadStore)
                storePassword System.getenv('ICHIJI_UPLOAD_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('ICHIJI_UPLOAD_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            // R8 shrinks and optimizes the code; names are kept so crash reports stay readable.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Google Play builds use the upload key. Test builds of the same release
            // code are signed with the throwaway key so they install on your phone.
            signingConfig uploadStore ? signingConfigs.upload : signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

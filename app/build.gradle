plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ichiji.kana'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ichiji.kana'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // A fixed signing key, so a newer build installs over an older one on your phone.
    // It's a debug key: fine for your own phone, not for publishing on Google Play.
    signingConfigs {
        shared {
            storeFile file('ichiji-debug.keystore')
            storePassword 'android'
            keyAlias 'ichiji'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Ichiji.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Ichiji-apk
          path: Ichiji.apk

      - name: Publish it under Releases (easy to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ichiji build ${{ github.run_number }}
          body: Open this page on your Android phone and tap Ichiji.apk to install.
          files: Ichiji.apk
          make_latest: true
